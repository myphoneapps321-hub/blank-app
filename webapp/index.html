<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicateurs de performance des adductions de DRPN — En ligne</title>
<style>
  :root{ --teal:#1667b3; --teal-d:#0c3f70; --bg:#eef5fc; --line:#cfe0f2; --ink:#123049; --red:#c0392b; }
  *{ box-sizing:border-box; } body{ font-family:"Segoe UI",Roboto,Arial,sans-serif; margin:0; background:var(--bg); color:var(--ink); }
  header{ background:linear-gradient(120deg,var(--teal),var(--teal-d)); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header .t{ font-weight:800; font-size:16px; } header .sp{ flex:1; }
  header .badge{ background:rgba(255,255,255,.18); padding:4px 10px; border-radius:20px; font-size:13px; }
  button{ padding:7px 12px; border:0; border-radius:6px; background:var(--teal); color:#fff; font-size:13px; cursor:pointer; }
  button.sec{ background:#eef4f2; color:var(--teal-d); border:1px solid var(--line); }
  .layout{ display:flex; align-items:stretch; }
  .side{ flex:0 0 210px; background:linear-gradient(180deg,#0c3f70,#1667b3); color:#fff; min-height:calc(100vh - 96px); padding:8px 0; }
  .side .nav{ display:block; padding:10px 18px; color:#eaf2fb; cursor:pointer; font-size:14px; border-left:3px solid transparent; }
  .side .nav.active{ background:#fff; color:var(--teal-d); font-weight:700; border-left-color:#7fd8ff; }
  main{ flex:1; min-width:0; padding:16px 20px 50px; }
  h2{ font-size:16px; color:var(--teal-d); }
  .tbl-wrap{ overflow-x:auto; } table{ border-collapse:collapse; width:100%; font-size:12.5px; }
  th,td{ border:1px solid var(--line); padding:6px 9px; text-align:right; white-space:nowrap; }
  th{ background:#dbeafb; color:#0c3f70; position:sticky; top:0; } td:first-child,th:first-child{ text-align:left; }
  tbody tr:nth-child(even){ background:#f5faff; }
  td input{ width:100%; min-width:80px; border:1px solid transparent; background:transparent; text-align:right; padding:3px; border-radius:4px; }
  td input:focus{ border-color:var(--teal); background:#fff; outline:none; }
  tr.bold td{ font-weight:700; background:#eef6ff; } tr.section td{ background:#0c3f70; color:#fff; font-weight:700; text-align:left; }
  .kpis{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:10px; }
  .kpi{ flex:1; min-width:150px; background:#eaf3fd; border:1px solid var(--line); border-radius:10px; padding:12px; }
  .kpi .v{ font-size:24px; font-weight:800; color:var(--teal-d); } .kpi .l{ font-size:12px; color:#5a746c; }
  .overlay{ position:fixed; inset:0; background:linear-gradient(140deg,#1560a0,#082a45); display:flex; align-items:center; justify-content:center; z-index:50; }
  .card{ background:#fff; padding:26px 30px; border-radius:14px; width:340px; max-width:92vw; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .card h1{ font-size:18px; color:var(--teal-d); margin:0 0 4px; } .card p{ color:#5a746c; font-size:13px; margin:0 0 14px; }
  .card input{ width:100%; padding:10px; margin:6px 0; border:1px solid var(--line); border-radius:8px; }
  .card button{ width:100%; padding:11px; font-size:15px; margin-top:8px; }
  .msg{ color:var(--red); font-size:13px; min-height:18px; } .ok{ color:#0a6b4a; }
  .save-ind{ font-size:12px; color:#0a6b4a; }
  #app{ display:none; }
</style>
</head>
<body>

<!-- Écran de connexion -->
<div class="overlay" id="login">
  <div class="card">
    <h1>💧 DRPN — Indicateurs des adductions</h1>
    <p>Connexion sécurisée · ONEE Branche Eau</p>
    <input type="email" id="email" placeholder="Adresse e-mail" autocomplete="username">
    <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')seConnecter()">
    <button onclick="seConnecter()">Se connecter</button>
    <p class="msg" id="loginMsg"></p>
    <p style="font-size:12px;color:#98a" id="cfgWarn"></p>
  </div>
</div>

<div id="app">
  <header>
    <span class="t">💧 Adductions DRPN</span>
    <span class="badge" id="whoBadge"></span>
    <span class="save-ind" id="saveInd"></span>
    <span class="sp"></span>
    <button class="sec" onclick="seDeconnecter()">Déconnexion</button>
  </header>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <main id="main"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============ CONFIG — à remplir avec ton projet Supabase ============
const SUPABASE_URL = "https://VOTRE-PROJET.supabase.co";
const SUPABASE_ANON_KEY = "VOTRE_CLE_ANON_PUBLIQUE";
// ====================================================================

const CATS={2:"Grandes adductions",1:"Petites & moyennes",3:"Stations de traitement"};
const SECTEURS=[1,2,3,4];
const N=x=>(isNaN(+x)?0:+x);
const fmt=x=>Math.round(N(x)).toLocaleString("fr-FR");
const pct=x=>N(x).toFixed(2).replace(".",",")+" %";
const esc=s=>String(s).replace(/</g,"&lt;").replace(/"/g,"&quot;");

let sb=null, centres=[], flux=[], role="agent", secteur=null, profil=0, tab="saisie", userEmail="";

// ---- Calcul (repris de la version validée) ----
const potables=()=>centres.filter(c=>c.type!=="brute");
const prodTot=c=>N(c.prod_sup)+N(c.prod_sout)+N(c.prod_dess);
const fluxOut=n=>flux.reduce((t,f)=>t+(f.source===n?N(f.volume):0),0);
const fluxIn =n=>flux.reduce((t,f)=>t+(f.destination===n?N(f.volume):0),0);
function perCentre(c){ const production=prodTot(c), ventes=N(c.srm)+N(c.amendis);
  const achInt=fluxIn(c.centre), cessInt=fluxOut(c.centre);
  const entree=production+achInt+N(c.achat_dr)+N(c.achat_ext);
  const sortie=ventes+cessInt+N(c.cession_dr)+N(c.pertes);
  return {production,ventes,entree,sortie,pertesNT:entree-sortie,
    achatAdd:achInt+N(c.achat_dr), cessionAdd:cessInt+N(c.cession_dr),
    rdt:entree?sortie/entree*100:0}; }
function agg(sub){ const set=new Set(sub.map(c=>c.centre)); let bo=0,bi=0;
  flux.forEach(f=>{ const s=set.has(f.source),d=set.has(f.destination); if(s&&!d)bo+=N(f.volume); if(d&&!s)bi+=N(f.volume); });
  const S=fn=>sub.reduce((a,c)=>a+fn(c),0);
  const prod=S(prodTot),aDR=S(c=>N(c.achat_dr)),ext=S(c=>N(c.achat_ext)),cDR=S(c=>N(c.cession_dr)),
        vte=S(c=>N(c.srm)+N(c.amendis)),pt=S(c=>N(c.pertes));
  const entree=prod+bi+aDR+ext, sortie=vte+bo+cDR+pt;
  return {nb:sub.length,production:prod,entree,ventes:vte,achatAdd:bi+aDR,achatExt:ext,
    cessionAdd:bo+cDR,pertes:pt,sortie,pertesNT:entree-sortie,rdt:entree?sortie/entree*100:0}; }
function synthSecteurs(){ const r=[]; SECTEURS.forEach(s=>{const sub=potables().filter(c=>+c.secteur===s); if(sub.length) r.push({per:"SPN"+s,...agg(sub)});}); r.push({per:"DR GLOBALE",...agg(potables())}); return r; }
function synthCategories(){ const r=[]; [2,1,3].forEach(k=>{const sub=potables().filter(c=>+c.categorie===k); if(sub.length) r.push({per:CATS[k]+" (cat. "+k+")",...agg(sub)});}); r.push({per:"DR GLOBALE",...agg(potables())}); return r; }

// ---- Authentification ----
function initSb(){ if(!window.supabase){ return false; }
  if(SUPABASE_URL.indexOf("VOTRE-PROJET")>=0){ document.getElementById("cfgWarn").textContent="⚠ Configurez SUPABASE_URL et SUPABASE_ANON_KEY dans le fichier."; return false; }
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); return true; }
async function seConnecter(){ const email=document.getElementById("email").value, pwd=document.getElementById("pwd").value;
  document.getElementById("loginMsg").textContent="Connexion…";
  const {error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error) document.getElementById("loginMsg").textContent="Échec : "+error.message; }
async function seDeconnecter(){ await sb.auth.signOut(); location.reload(); }

async function demarrerSession(session){
  userEmail=session.user.email;
  const {data:prof}=await sb.from("profiles").select("role,secteur").eq("id",session.user.id).single();
  role=(prof&&prof.role)||"agent"; secteur=prof?prof.secteur:null; profil=role==="dr"?0:(secteur||1);
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("whoBadge").textContent = role==="dr"?"Responsable DR":("Agent SPN"+secteur);
  await chargerDonnees(); construireNav(); abonnerTempsReel(); render();
}
async function chargerDonnees(){
  const c=await sb.from("centres").select("*").order("id");
  const f=await sb.from("flux").select("*").order("id");
  centres=c.data||[]; flux=f.data||[];
}
function abonnerTempsReel(){
  sb.channel("live")
    .on("postgres_changes",{event:"*",schema:"public",table:"centres"},()=>rafraichir())
    .on("postgres_changes",{event:"*",schema:"public",table:"flux"},()=>rafraichir())
    .subscribe();
}
let rT=null; function rafraichir(){ clearTimeout(rT); rT=setTimeout(async()=>{ await chargerDonnees(); render(); },400); }

// ---- Sauvegarde d'une cellule ----
let saveT=null; function flashSave(txt){ const e=document.getElementById("saveInd"); e.textContent=txt; clearTimeout(saveT); saveT=setTimeout(()=>e.textContent="",1500); }
async function majCentre(id,champ,val){ const c=centres.find(x=>x.id===id); if(!c)return; c[champ]=val;
  const {error}=await sb.from("centres").update({[champ]:val,updated_at:new Date().toISOString()}).eq("id",id);
  flashSave(error?("Erreur: "+error.message):"✓ enregistré"); render(); }
async function majFlux(id,champ,val){ const f=flux.find(x=>x.id===id); if(!f)return; f[champ]=val;
  const {error}=await sb.from("flux").update({[champ]:val,updated_at:new Date().toISOString()}).eq("id",id);
  flashSave(error?("Erreur: "+error.message):"✓ enregistré"); render(); }

// ---- Navigation ----
function construireNav(){ const items = role==="dr"
    ? [["res","📊 Résultats consolidés"],["base","🗄️ Base de données"],["saisie","✏️ Saisie DR"]]
    : [["saisie","✏️ Ma saisie (SPN"+secteur+")"],["res","📊 Mes résultats"]];
  tab=items[0][0];
  document.getElementById("side").innerHTML=items.map(([k,l])=>`<div class="nav" data-t="${k}" onclick="showTab('${k}')">${l}</div>`).join("");
}
function showTab(t){ tab=t; document.querySelectorAll(".side .nav").forEach(e=>e.classList.toggle("active",e.dataset.t===t)); render(); }

// ---- Rendu ----
function mesCentres(){ return role==="dr"? centres.filter(c=>c.type!=="brute") : centres.filter(c=>+c.secteur===secteur); }
function mesFlux(){ return role==="dr"? flux : flux.filter(f=>+f.secteur===secteur); }
function num(id,f,v){ return `<td><input type="number" step="any" value="${N(v)}" onchange="majCentre(${id},'${f}',+this.value)"></td>`; }

function render(){
  document.querySelectorAll(".side .nav").forEach(e=>e.classList.toggle("active",e.dataset.t===tab));
  const m=document.getElementById("main");
  if(tab==="saisie") m.innerHTML=vueSaisie();
  else if(tab==="base") m.innerHTML=vueBase();
  else m.innerHTML=vueResultats();
}
function vueSaisie(){
  const list=mesCentres();
  let h=`<h2>Saisie des données ${role==="dr"?"(tous secteurs)":"— SPN"+secteur}</h2><div class="tbl-wrap"><table>
    <thead><tr><th>Centre</th><th>SPN</th><th>Prod. superf.</th><th>Prod. souterr.</th><th>Dessalement</th>
    <th>Achat autre DR</th><th>Achat externe</th><th>Cession autre DR</th><th>Vente SRM</th><th>Vente AMENDIS</th><th>Pertes tech.</th><th>Linéaire km</th></tr></thead><tbody>`;
  list.forEach(c=>{ h+=`<tr><td>${esc(c.centre)}</td><td>SPN${c.secteur}</td>
    ${num(c.id,'prod_sup',c.prod_sup)}${num(c.id,'prod_sout',c.prod_sout)}${num(c.id,'prod_dess',c.prod_dess)}
    ${num(c.id,'achat_dr',c.achat_dr)}${num(c.id,'achat_ext',c.achat_ext)}${num(c.id,'cession_dr',c.cession_dr)}
    ${num(c.id,'srm',c.srm)}${num(c.id,'amendis',c.amendis)}${num(c.id,'pertes',c.pertes)}${num(c.id,'lineaire',c.lineaire)}</tr>`; });
  h+=`</tbody></table></div>
    <h2>Cessions internes (source → destination)</h2><div class="tbl-wrap"><table>
    <thead><tr><th>Source</th><th>Destination</th><th>Volume (m³)</th></tr></thead><tbody>`;
  mesFlux().forEach(f=>{ h+=`<tr><td>${esc(f.source)}</td><td>${esc(f.destination)}</td>
    <td><input type="number" step="any" value="${N(f.volume)}" onchange="majFlux(${f.id},'volume',+this.value)"></td></tr>`; });
  return h+"</tbody></table></div>";
}
function vueBase(){
  let h=`<h2>Base de données — référentiel des centres</h2><div class="tbl-wrap"><table>
    <thead><tr><th>Centre</th><th>SPN</th><th>Catégorie</th><th>Type</th></tr></thead><tbody>`;
  centres.forEach(c=>{ h+=`<tr><td>${esc(c.centre)}</td><td>SPN${c.secteur}</td><td>${c.categorie} · ${CATS[c.categorie]||''}</td><td>${c.type}</td></tr>`; });
  return h+"</tbody></table></div>";
}
const SYN_HEAD=`<thead><tr><th>Périmètre</th><th>Production</th><th>Achat adduction</th><th>Achat externe adduction</th><th>Cession adduction</th><th>Ventes sur adduction</th><th>Pertes techniques sur adduction</th><th>Rendement adduction</th></tr></thead><tbody>`;
const synRow=(s,cls)=>`<tr class="${cls||''}"><td>${s.per}</td><td>${fmt(s.production)}</td><td>${fmt(s.achatAdd)}</td><td>${fmt(s.achatExt)}</td><td>${fmt(s.cessionAdd)}</td><td>${fmt(s.ventes)}</td><td>${fmt(s.pertes)}</td><td>${pct(s.rdt)}</td></tr>`;
function vueResultats(){
  const scope = role==="dr"? potables() : potables().filter(c=>+c.secteur===secteur);
  const dr = role==="dr"? synthSecteurs().find(s=>s.per==="DR GLOBALE") : agg(scope);
  let h=`<div class="kpis">
    <div class="kpi"><div class="v">${pct(dr.rdt)}</div><div class="l">Rendement ${role==="dr"?"DR globale":"SPN"+secteur}</div></div>
    <div class="kpi"><div class="v">${fmt(dr.entree)}</div><div class="l">Entrée (m³)</div></div>
    <div class="kpi"><div class="v">${fmt(dr.ventes)}</div><div class="l">Ventes (m³)</div></div>
    <div class="kpi"><div class="v">${fmt(dr.pertesNT)}</div><div class="l">Pertes non techniques (m³)</div></div></div>`;
  // détail par centre
  h+=`<h2>Détail par centre</h2><div class="tbl-wrap"><table><thead><tr><th>Centre Production</th><th>Production</th><th>Achat adduction</th><th>Achat externe adduction</th><th>Cession adduction</th><th>Ventes sur adduction</th><th>Pertes techniques sur adduction</th><th>Rendement adduction</th></tr></thead><tbody>`;
  scope.forEach(c=>{ const r=perCentre(c); h+=`<tr><td>${esc(c.centre)}</td><td>${fmt(r.production)}</td><td>${fmt(r.achatAdd)}</td><td>${fmt(c.achat_ext)}</td><td>${fmt(r.cessionAdd)}</td><td>${fmt(r.ventes)}</td><td>${fmt(c.pertes)}</td><td>${pct(r.rdt)}</td></tr>`; });
  h+="</tbody></table></div>";
  // synthèse globale (DR uniquement)
  if(role==="dr"){
    const secs=synthSecteurs().filter(s=>s.per!=="DR GLOBALE"), cats=synthCategories().filter(s=>s.per!=="DR GLOBALE");
    const sect=t=>`<tr class="section"><td colspan="8">${t}</td></tr>`;
    h+=`<h2>Rendement global (synthèses)</h2><div class="tbl-wrap"><table>${SYN_HEAD}
      ${sect("Synthèse 1 — par secteur de production")}${secs.map(s=>synRow(s)).join("")}
      ${sect("Synthèse 2 — par type d'adduction")}${cats.map(s=>synRow(s)).join("")}
      ${synRow(dr,"bold")}</tbody></table></div>`;
  }
  return h;
}

// ---- Démarrage ----
(function(){
  if(!initSb()) return;
  sb.auth.getSession().then(({data})=>{ if(data.session) demarrerSession(data.session); });
  sb.auth.onAuthStateChange((_e,session)=>{ if(session) demarrerSession(session); });
})();
</script>
</body>
</html>

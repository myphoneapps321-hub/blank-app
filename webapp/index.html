<html lang="fr">

<title>Indicateurs de performance des adductions de DRPN</title>

  .kpi{ flex:1; min-width:150px; background:#eaf3fd; border:1px solid var(--line); border-radius:10px; padding:12px; }

  .warn{ background:#fff6e6; border:1px solid #f0d9a8; color:#8a5a00; padding:8px 12px; border-radius:8px; font-size:12.5px; margin:6px 0; }
  .ok{ background:#eafaf2; border:1px solid #bfe6d3; color:#0a6b4a; padding:8px 12px; border-radius:8px; font-size:12.5px; margin:6px 0; }
  .up{ color:#0a6b4a; font-weight:700; } .down{ color:var(--red); font-weight:700; }
  .overlay{ position:fixed; inset:0; background:linear-gradient(140deg,#1560a0,#082a45); display:flex; align-items:center; justify-content:center; z-index:50; }
  .card{ background:#fff; padding:26px 30px; border-radius:14px; width:360px; max-width:92vw; box-shadow:0 10px 40px rgba(0,0,0,.3); text-align:center; }
  .card h1{ font-size:18px; color:var(--teal-d); margin:0 0 4px; } .card p{ color:#5a746c; font-size:13px; margin:0 0 14px; }

  .card button{ width:100%; padding:11px; font-size:15px; margin-top:8px; }
  .prof{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:6px; }
  .prof button{ width:auto; margin:0; }
  .msg{ color:var(--red); font-size:13px; min-height:18px; }
  .save-ind{ font-size:12px; color:#0a6b4a; }
  #app{ display:none; }
</style>
</head>

  const prod=S(prodTot),aDR=S(c=>N(c.achat_dr)),ext=S(c=>N(c.achat_ext)),cDR=S(c=>N(c.cession_dr)),vte=S(c=>N(c.srm)+N(c.amendis)),pt=S(c=>N(c.pertes));
  const entree=prod+bi+aDR+ext, sortie=vte+bo+cDR+pt;
  return {nb:sub.length,production:prod,entree,ventes:vte,achatAdd:bi+aDR,achatExt:ext,cessionAdd:bo+cDR,pertes:pt,sortie,pertesNT:entree-sortie,rdt:entree?sortie/entree*100:0}; }
function synthSecteurs(){ const r=[]; SECTEURS.forEach(s=>{const sub=potables().filter(c=>+c.secteur===s); if(sub.length) r.push({per:"SPN"+s,...agg(sub)});}); r.push({per:"DR GLOBALE",...agg(potables())}); return r; }
function synthCategories(){ const r=[]; [2,1,3].forEach(k=>{const sub=potables().filter(c=>+c.categorie===k); if(sub.length) r.push({per:CATS[k]+" (cat. "+k+")",...agg(sub)});}); r.push({per:"DR GLOBALE",...agg(potables())}); return r; }

// ---- Démarrage / mode ----
function initSb(){ if(!window.supabase) return false;
  if(SUPABASE_URL.indexOf("VOTRE-PROJET")>=0) return false;
  try{ sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); return true; }catch(e){ return false; } }
(function(){
  DEMO=!initSb();
  if(DEMO){ document.getElementById("gateSub").textContent="Mode démonstration local (Supabase non configuré)";
    document.getElementById("loginBox").style.display="none"; document.getElementById("demoBox").style.display="block"; }
  else { sb.auth.getSession().then(({data})=>{ if(data.session) demarrerSession(data.session); });
    sb.auth.onAuthStateChange((_e,session)=>{ if(session) demarrerSession(session); }); }
})();

// ---- Mode DÉMO (localStorage) ----
function lsLoad(){ try{ const d=JSON.parse(localStorage.getItem("drpn_demo")||"null");
  if(d&&d.centres){ centres=d.centres; flux=d.flux; hist=d.hist||[]; return; } }catch(e){}
  centres=JSON.parse(JSON.stringify(DEMO_CENTRES)); flux=JSON.parse(JSON.stringify(DEMO_FLUX)); hist=[]; }
function lsSave(){ localStorage.setItem("drpn_demo",JSON.stringify({centres,flux,hist})); }
function demarrerDemo(r,sec){ role=r; secteur=sec; lsLoad();
  document.getElementById("demoBadge").style.display="inline-block";
  finDemarrage(); }

// ---- Mode SUPABASE ----
async function seConnecter(){ const email=document.getElementById("email").value, pwd=document.getElementById("pwd").value;
  document.getElementById("loginMsg").textContent="Connexion…";
  const {error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error) document.getElementById("loginMsg").textContent="Échec : "+error.message; }
async function demarrerSession(session){
  const {data:prof}=await sb.from("profiles").select("role,secteur").eq("id",session.user.id).single();
  role=(prof&&prof.role)||"agent"; secteur=prof?prof.secteur:null;
  await chargerSupabase(); abonnerTempsReel();
  try{ hist=JSON.parse(localStorage.getItem("drpn_hist")||"[]"); }catch(e){ hist=[]; }
  finDemarrage(); }
async function chargerSupabase(){ const c=await sb.from("centres").select("*").order("id"); const f=await sb.from("flux").select("*").order("id"); centres=c.data||[]; flux=f.data||[]; }
function abonnerTempsReel(){ sb.channel("live")
  .on("postgres_changes",{event:"*",schema:"public",table:"centres"},()=>rafraichir())
  .on("postgres_changes",{event:"*",schema:"public",table:"flux"},()=>rafraichir()).subscribe(); }
let rT=null; function rafraichir(){ clearTimeout(rT); rT=setTimeout(async()=>{ await chargerSupabase(); render(); },400); }

function finDemarrage(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("whoBadge").textContent = role==="dr"?"Responsable DR":("Agent SPN"+secteur);
  construireNav(); render();
}
function quitter(){ if(DEMO){ location.reload(); } else { sb.auth.signOut().then(()=>location.reload()); } }

// ---- Sauvegarde d'une cellule ----
let saveT=null; function flashSave(t){ const e=document.getElementById("saveInd"); e.textContent=t; clearTimeout(saveT); saveT=setTimeout(()=>e.textContent="",1500); }
async function majCentre(id,champ,val){ const c=centres.find(x=>x.id===id); if(!c)return; c[champ]=val;
  if(DEMO){ lsSave(); flashSave("✓ enregistré"); }
  else { const {error}=await sb.from("centres").update({[champ]:val,updated_at:new Date().toISOString()}).eq("id",id); flashSave(error?("Erreur: "+error.message):"✓ enregistré"); }
  render(); }
async function majFlux(id,champ,val){ const f=flux.find(x=>x.id===id); if(!f)return; f[champ]=val;
  if(DEMO){ lsSave(); flashSave("✓ enregistré"); }
  else { const {error}=await sb.from("flux").update({[champ]:val,updated_at:new Date().toISOString()}).eq("id",id); flashSave(error?("Erreur: "+error.message):"✓ enregistré"); }
  render(); }

// ---- Navigation ----
function construireNav(){ const items = role==="dr"
    ? [["res","📊 Résultats consolidés"],["ana","📈 Analyses"],["hist","🕘 Historique"],["base","🗄️ Base de données"],["saisie","✏️ Saisie"]]
    : [["saisie","✏️ Ma saisie (SPN"+secteur+")"],["res","📊 Mes résultats"],["ana","📈 Analyses"]];
  tab=items[0][0];
  document.getElementById("side").innerHTML=items.map(([k,l])=>`<div class="nav" data-t="${k}" onclick="showTab('${k}')">${l}</div>`).join("");
}
function showTab(t){ tab=t; render(); }
function mesCentres(){ return role==="dr"? potables() : potables().filter(c=>+c.secteur===secteur); }
function mesFlux(){ return role==="dr"? flux : flux.filter(f=>+f.secteur===secteur); }
const num=(id,f,v)=>`<td><input type="number" step="any" value="${N(v)}" onchange="majCentre(${id},'${f}',+this.value)"></td>`;

// ---- Rendu ----
function render(){
  document.querySelectorAll(".side .nav").forEach(e=>e.classList.toggle("active",e.dataset.t===tab));
  const m=document.getElementById("main");
  m.innerHTML = tab==="saisie"?vueSaisie() : tab==="base"?vueBase() : tab==="ana"?vueAnalyses() : tab==="hist"?vueHistorique() : vueResultats();
}
function vueSaisie(){
  let h=`<h2>Saisie des données ${role==="dr"?"(tous secteurs)":"— SPN"+secteur}</h2><div class="tbl-wrap"><table>
    <thead><tr><th>Centre</th><th>SPN</th><th>Prod. superf.</th><th>Prod. souterr.</th><th>Dessalement</th>
    <th>Achat autre DR</th><th>Achat externe</th><th>Cession autre DR</th><th>Vente SRM</th><th>Vente AMENDIS</th><th>Pertes tech.</th><th>Linéaire km</th></tr></thead><tbody>`;
  mesCentres().forEach(c=>{ h+=`<tr><td>${esc(c.centre)}</td><td>SPN${c.secteur}</td>
    ${num(c.id,'prod_sup',c.prod_sup)}${num(c.id,'prod_sout',c.prod_sout)}${num(c.id,'prod_dess',c.prod_dess)}
    ${num(c.id,'achat_dr',c.achat_dr)}${num(c.id,'achat_ext',c.achat_ext)}${num(c.id,'cession_dr',c.cession_dr)}
    ${num(c.id,'srm',c.srm)}${num(c.id,'amendis',c.amendis)}${num(c.id,'pertes',c.pertes)}${num(c.id,'lineaire',c.lineaire)}</tr>`; });
  h+=`</tbody></table></div><h2>Cessions internes (source → destination)</h2><div class="tbl-wrap"><table>
    <thead><tr><th>Source</th><th>Destination</th><th>Volume (m³)</th></tr></thead><tbody>`;
  mesFlux().forEach(f=>{ h+=`<tr><td>${esc(f.source)}</td><td>${esc(f.destination)}</td>
    <td><input type="number" step="any" value="${N(f.volume)}" onchange="majFlux(${f.id},'volume',+this.value)"></td></tr>`; });
  return h+"</tbody></table></div>";
}
function vueBase(){ let h=`<h2>Base de données — référentiel</h2><div class="tbl-wrap"><table><thead><tr><th>Centre</th><th>SPN</th><th>Catégorie</th><th>Type</th></tr></thead><tbody>`;
  centres.forEach(c=>h+=`<tr><td>${esc(c.centre)}</td><td>SPN${c.secteur}</td><td>${c.categorie} · ${CATS[c.categorie]||''}</td><td>${c.type}</td></tr>`);
  return h+"</tbody></table></div>"; }
const SYN_HEAD=`<thead><tr><th>Périmètre</th><th>Production</th><th>Achat adduction</th><th>Achat externe adduction</th><th>Cession adduction</th><th>Ventes sur adduction</th><th>Pertes techniques sur adduction</th><th>Rendement adduction</th></tr></thead><tbody>`;
const synRow=(s,cls)=>`<tr class="${cls||''}"><td>${s.per}</td><td>${fmt(s.production)}</td><td>${fmt(s.achatAdd)}</td><td>${fmt(s.achatExt)}</td><td>${fmt(s.cessionAdd)}</td><td>${fmt(s.ventes)}</td><td>${fmt(s.pertes)}</td><td>${pct(s.rdt)}</td></tr>`;
function vueResultats(){
  const scope = role==="dr"? potables() : potables().filter(c=>+c.secteur===secteur);
  const dr = role==="dr"? synthSecteurs().find(s=>s.per==="DR GLOBALE") : agg(scope);
  let h=`<div class="kpis">
    <div class="kpi"><div class="v">${pct(dr.rdt)}</div><div class="l">Rendement ${role==="dr"?"DR globale":"SPN"+secteur}</div></div>
    <div class="kpi"><div class="v">${fmt(dr.entree)}</div><div class="l">Entrée (m³)</div></div>
    <div class="kpi"><div class="v">${fmt(dr.ventes)}</div><div class="l">Ventes (m³)</div></div>
    <div class="kpi"><div class="v">${fmt(dr.pertesNT)}</div><div class="l">Pertes non techniques (m³)</div></div></div>`;
  h+=`<h2>Détail par centre</h2><div class="tbl-wrap"><table><thead><tr><th>Centre Production</th><th>Production</th><th>Achat adduction</th><th>Achat externe adduction</th><th>Cession adduction</th><th>Ventes sur adduction</th><th>Pertes techniques sur adduction</th><th>Rendement adduction</th></tr></thead><tbody>`;
  scope.forEach(c=>{ const r=perCentre(c); const b=r.rdt>100.001?' class="bad"':''; h+=`<tr><td>${esc(c.centre)}</td><td>${fmt(r.production)}</td><td>${fmt(r.achatAdd)}</td><td>${fmt(c.achat_ext)}</td><td>${fmt(r.cessionAdd)}</td><td>${fmt(r.ventes)}</td><td>${fmt(c.pertes)}</td><td${b}>${pct(r.rdt)}</td></tr>`; });
  h+="</tbody></table></div>";
  if(role==="dr"){ const secs=synthSecteurs().filter(s=>s.per!=="DR GLOBALE"),cats=synthCategories().filter(s=>s.per!=="DR GLOBALE");
    const sect=t=>`<tr class="section"><td colspan="8">${t}</td></tr>`;
    h+=`<h2>Rendement global (synthèses)</h2><div class="tbl-wrap"><table>${SYN_HEAD}
      ${sect("Synthèse 1 — par secteur de production")}${secs.map(s=>synRow(s)).join("")}
      ${sect("Synthèse 2 — par type d'adduction")}${cats.map(s=>synRow(s)).join("")}${synRow(dr,"bold")}</tbody></table></div>`; }
  return h;
}
function vueAnalyses(){
  let det=mesCentres().map(c=>({c,r:perCentre(c)}));
  const pnt=det.filter(o=>o.r.entree>0).sort((a,b)=>b.r.pertesNT-a.r.pertesNT);
  const totPNT=pnt.reduce((a,o)=>a+Math.max(0,o.r.pertesNT),0);
  let h=`<h2>Pertes non techniques — eau réellement perdue</h2><div class="warn">Volume total perdu : <b>${fmt(totPNT)} m³</b></div><div class="tbl-wrap"><table><thead><tr><th>Centre</th><th>SPN</th><th>Entrée</th><th>Sortie</th><th>Pertes non tech.</th><th>Taux</th></tr></thead><tbody>`;
  pnt.forEach(o=>{ const taux=o.r.entree?o.r.pertesNT/o.r.entree*100:0; const bad=o.r.pertesNT>0.5; h+=`<tr><td>${esc(o.c.centre)}</td><td>SPN${o.c.secteur}</td><td>${fmt(o.r.entree)}</td><td>${fmt(o.r.sortie)}</td><td class="${bad?'bad':'good'}">${fmt(o.r.pertesNT)}</td><td class="${bad?'bad':'good'}">${pct(taux)}</td></tr>`; });
  h+="</tbody></table></div>";
  const pt=det.filter(o=>o.r.entree>0).sort((a,b)=>b.r.tauxPT-a.r.tauxPT);
  h+=`<h2>Pertes techniques (seuil ≤ ${SEUIL_PT} %)</h2><div class="tbl-wrap"><table><thead><tr><th>Centre</th><th>SPN</th><th>Pertes tech.</th><th>Entrée</th><th>Taux</th><th>Seuil</th></tr></thead><tbody>`;
  pt.forEach(o=>{ const bad=o.r.tauxPT>SEUIL_PT; h+=`<tr><td>${esc(o.c.centre)}</td><td>SPN${o.c.secteur}</td><td>${fmt(o.c.pertes)}</td><td>${fmt(o.r.entree)}</td><td class="${bad?'bad':'good'}">${pct(o.r.tauxPT)}</td><td>${bad?'✗':'✓'}</td></tr>`; });
  h+="</tbody></table></div>";
  const il=det.filter(o=>o.r.ilp!==null).sort((a,b)=>b.r.ilp-a.r.ilp);
  h+=`<h2>Indice Linéaire de Pertes — ILP (m³/km/j)</h2>`;
  h+= il.length? `<div class="tbl-wrap"><table><thead><tr><th>Centre</th><th>SPN</th><th>Volume perdu</th><th>Linéaire km</th><th>ILP</th></tr></thead><tbody>`+il.map(o=>`<tr><td>${esc(o.c.centre)}</td><td>SPN${o.c.secteur}</td><td>${fmt(o.r.volPerdu)}</td><td>${fmt2(o.c.lineaire)}</td><td>${fmt2(o.r.ilp)}</td></tr>`).join("")+"</tbody></table></div>"
    : `<div class="warn">Saisir le linéaire (km) des centres pour calculer l'ILP.</div>`;
  const totV=det.reduce((a,o)=>a+o.r.ventes,0),srm=det.reduce((a,o)=>a+N(o.c.srm),0),am=det.reduce((a,o)=>a+N(o.c.amendis),0);
  h+=`<h2>Ventes</h2><div class="kpis"><div class="kpi"><div class="v">${fmt(totV)}</div><div class="l">Ventes totales</div></div><div class="kpi"><div class="v">${fmt(srm)}</div><div class="l">SRM (${totV?(srm/totV*100).toFixed(1):0}%)</div></div><div class="kpi"><div class="v">${fmt(am)}</div><div class="l">AMENDIS (${totV?(am/totV*100).toFixed(1):0}%)</div></div></div>`;
  return h;
}
function histSave(){ if(DEMO) lsSave(); else localStorage.setItem("drpn_hist",JSON.stringify(hist)); }
function archiver(){ const dr=agg(potables()); const vt=potables().reduce((a,c)=>a+N(c.srm)+N(c.amendis),0);
  const per=prompt("Nom de la période à archiver :","Période "+(hist.length+1)); if(per===null)return;
  hist.push({periode:per,date:new Date().toLocaleDateString("fr-FR"),ventesTotal:vt,dr:{rdt:dr.rdt,entree:dr.entree,pertes:dr.pertes}}); histSave(); render(); }
function delHist(i){ if(confirm("Supprimer cette période ?")){ hist.splice(i,1); histSave(); render(); } }
function vueHistorique(){
  let h=`<h2>Historique des périodes</h2><p><button onclick="archiver()">📌 Archiver la période courante</button></p>`;
  if(!hist.length) return h+`<div class="warn">Aucune période archivée.</div>`;
  h+=`<div class="tbl-wrap"><table><thead><tr><th>Période</th><th>Date</th><th>Rendement DR</th><th>Ventes</th><th>Δ rendement</th><th>Δ ventes</th><th></th></tr></thead><tbody>`;
  hist.forEach((s,i)=>{ const p=i>0?hist[i-1]:null; const dR=p?(s.dr.rdt-p.dr.rdt):null; const dV=p&&p.ventesTotal?(s.ventesTotal-p.ventesTotal)/p.ventesTotal*100:null;
    h+=`<tr><td>${esc(s.periode)}</td><td>${s.date}</td><td>${pct(s.dr.rdt)}</td><td>${fmt(s.ventesTotal)}</td>
      <td class="${dR===null?'':(dR>=0?'up':'down')}">${dR===null?"—":(dR>=0?"▲ +":"▼ ")+dR.toFixed(2)+" pts"}</td>
      <td class="${dV===null?'':(dV>=0?'up':'down')}">${dV===null?"—":(dV>=0?"▲ +":"▼ ")+dV.toFixed(2)+" %"}</td>
      <td><button class="sec" onclick="delHist(${i})">✕</button></td></tr>`; });
  return h+"</tbody></table></div>";
}
</script>
</body>
</html>
